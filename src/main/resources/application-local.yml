spring:
  thymeleaf:
    cache: false
    prefix: file:src/main/resources/templates/
  web:
    resources:
      cache:
        period: 0
      chain:
        cache: false
      static-locations: file:src/main/resources/static/
  flyway:
    enabled: true
    url: ${MIGRATION_URL}
    user: ${MIGRATION_USER}
    password: ${MIGRATION_PASSWORD}
    default-schema: ${APP_SCHEMA}
    placeholders:
      history-table-name: flyway_schema_history
      app-user: ${SPRING_DATASOURCE_USERNAME}
server:
  servlet:
    session:
      cookie:
        secure: false
logging:
  level:
    org:
      springframework:
        jdbc:
          core:
            JdbcTemplate: DEBUG
            StatementCreatorUtils: TRACE
management:
  endpoints:
    access:
      default: unrestricted
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
