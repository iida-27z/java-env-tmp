name: QUICK-TEST

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: QuickTest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'
      - name: Check Code Formatting
        run: ./gradlew spotlessCheck
      - name: Run Tests
        run: ./gradlew test -Pquick
